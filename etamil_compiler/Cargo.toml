# etamil_compiler/Cargo.toml
# eTamil-Compiler: A Rust-based DSL Compiler for Tamil/Latin Bilingual FinTech
#
# Dependency policy: this file lists only crates the compiled code actually
# uses. Crates for planned work — a MongoDB or Redis driver, for instance — are
# deliberately absent; add them back in the commit that starts using them.
# The async server needed none: routing is this crate's own and tokio was
# already here, so axum and futures never became dependencies. See
# docs/ROADMAP.md.

[package]
name = "etamil_compiler"
version = "1.3.0"
edition = "2024"          # edition 2024 itself needs 1.85; the floor below is higher
# 1.88 is what the current `time` and `zip` releases require. Held at 1.85 until
# RUSTSEC-2026-0009 (a stack-exhaustion DoS in time, reached through jsonwebtoken)
# made the choice one between a known advisory and a higher floor.
rust-version = "1.88"
authors = ["Esan Maruff <esan@etamil.in>"]
description = "Bilingual (Tamil/Latin) FinTech DSL Compiler for Indian Regulatory Compliance"
# `license` alone. Cargo warns that only one of the two is necessary, and
# `license-file = "../LICENSE"` pointed outside the package directory, so
# `cargo package` would not have included the file it named.
license = "AGPL-3.0-or-later"
repository = "https://github.com/Maruff/etamil_compiler"
homepage = "https://etamil.in"
documentation = "https://etamil.in/manual/"
readme = "README.md"

# crates.io indexes on these, and they are how someone looking for a Tamil or
# an Indian-tax language finds this at all. Five keywords is the cap.
keywords = ["tamil", "dsl", "fintech", "compiler", "gst"]
# Both apply: it is a language implementation, and it is used from the shell.
categories = ["compilers", "command-line-utilities"]

# `cargo package` takes what git tracks, and two things this crate needs are
# deliberately untracked: the standard library and the licence are staged into
# the package by scripts/vendor_for_publish.py and gitignored so they cannot
# drift from the originals one directory up. Listing them here is what puts
# them in the archive anyway — without `nUlakam/`, build.rs has nothing to
# compile into the binary and the published crate would produce a compiler
# whose first import fails.
include = [
    "src/**/*",
    "tests/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "nUlakam/**/*.qmz",
]

# The user-facing binary is `etamil`; the library target is `etamil_compiler`.
[[bin]]
name = "etamil"
path = "src/main.rs"

# `cdylib` is what wasm-bindgen needs in order to emit a .wasm at all; `rlib`
# is what the binary above and the tests link against. Naming both keeps the
# native build unchanged apart from an extra unused dynamic library.
[lib]
name = "etamil_compiler"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# --- Compiler front end ---
# Fast lexer for bilingual (Tamil script / romanized) tokenization.
# 0.16.1 or newer: earlier patch releases lack the allow_greedy option that
# the line-comment skip pattern in lexer.rs needs.
logos = "0.16.1"

# --- Text ---
# String length and indexing count grapheme clusters, not code points: in
# Tamil a written letter such as கு is a consonant plus a vowel sign, and
# நீளம்("வணக்கம்") must be 5, not 7.
unicode-segmentation = "1.11"

# --- Numbers ---
# Every value in the language is a fixed-point decimal, not f64: this is a
# language for tax and accounting, where 0.1 + 0.2 must equal 0.3 exactly.
# `maths` supplies ln, exp, powd and sqrt on Decimal itself. They were
# hand-written series in nUlakam until the host had them, and the series
# were accurate to about 28 digits — so this has to be the decimal
# implementation and not f64, or the builtin would be a regression.
rust_decimal = { version = "1.37", features = ["maths"] }
# Direct LLVM FFI bindings, enabled with --features llvm (Linux/macOS only)
llvm-sys = { version = "180", features = ["prefer-dynamic"], optional = true }

# --- Runtime & HTTP server ---
# The sync server uses std::net; tokio provides the async runtime for main,
# the cache TTL timers, and the resilience module.
#
# Declared per-target, in the cfg(not(target_family = "wasm")) block below:
# net, fs and signal do not exist on wasm32, and the modules that use them
# (http, redis, db, net, fileio) are gated out of a wasm build anyway. The
# front end the browser needs -- lexer, parser, check -- touches none of them.

# --- Serialization, auth, and telemetry ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.35", features = ["serde"] }
# uuid, jsonwebtoken and bcrypt are per-target too: uuid's v4 needs an OS
# random source, and the other two reach a crypto backend with no wasm32
# build. Only the http module uses any of them.

# --- Signing ---
# HMAC-SHA256, for verifying a signed webhook. All three were already in the
# tree through jsonwebtoken; naming them directly costs nothing new. `subtle`
# is what makes the comparison constant-time, which is the whole point of a
# verify function — a byte-by-byte `==` leaks the signature one position at a
# time.
hmac = "0.13"
sha2 = "0.11"
subtle = "2.6"

# --- Outbound HTTP ---
# ureq with rustls, deliberately, and not reqwest with its defaults: those pull
# native-tls and therefore OpenSSL, which would break the static musl Linux
# package and falsify the README's "there is nothing else to install". ureq is
# also blocking, which is what a synchronous VM wants — no runtime, no
# spawn_blocking.
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"], optional = true }

# --- Database ---
# Blocking drivers throughout, which suit a synchronous VM behind a
# thread-per-request server. "bundled" compiles SQLite itself so there is no
# system dependency.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
postgres = { version = "0.19", optional = true }
# "minimal" leaves out TLS and the compression backends: a driver pulling in
# OpenSSL would put a C build back in the way of a plain `cargo build`, which
# is the thing the bundled SQLite exists to avoid.
mysql = { version = "25", optional = true, default-features = false, features = ["minimal"] }
# Needed to write the ToSql impl that adapts a value to the column's type:
# without it a number bound to an INT column is refused, because Decimal
# alone only accepts NUMERIC.
bytes = { version = "1", optional = true }
# --- ODF packages ---
# .odt and .ods are zip archives. Only Stored and Deflate are needed — an ODF
# package uses no other method — so the bzip2/zstd/lzma/AES backends are left
# out rather than carried.
# zip, p256 and getrandom are per-target: see the native block below. They are
# reached only from signing, fileio and the ODF package code, none of which is
# in a wasm build -- and p256 pulls a rand_core whose getrandom refuses to
# build for wasm32-unknown-unknown at all.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
webpki-roots = { version = "0.26", optional = true }
# --- MongoDB ---
# Behind a feature, like the other two non-bundled drivers. It costs about
# seventy crates, which is fewer than mysql already costs and about the same as
# postgres, so it is in line rather than exceptional — and none of it is in the
# default build.
#
# The sync feature is what makes it usable here: the VM is synchronous, and the
# async client would need a runtime driven from inside an interpreter loop.
mongodb = { version = "3.8.1", default-features = false, features = ["sync", "rustls-tls", "bson-3", "compat-3-3-0"], optional = true }
chacha20poly1305 = "0.11"
argon2 = "0.5"
base64 = "0.22"
zeroize = "1.8"

# --- Native-only dependencies ---
# Everything here needs an operating system: sockets, a filesystem, threads, or
# a crypto backend with no wasm32 build. The modules that use them are gated
# out of a wasm build in lib.rs.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "signal"] }
jsonwebtoken = "9.2"
bcrypt = "0.15"
uuid = { version = "1.6", features = ["v4", "serde"] }
# .odt and .ods are zip archives. Only Stored and Deflate are needed -- an ODF
# package uses no other method -- so the bzip2/zstd/lzma/AES backends are left
# out rather than carried.
zip = { version = "8", default-features = false, features = ["deflate"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }
# Randomness for key generation, taken straight from the OS.
getrandom = "0.3"

# Serial ports and a Raspberry Pi's GPIO for the VM (src/vm/board.rs):
# termios, poll and ioctl. Already in the tree through tokio and others.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# --- Browser-only dependencies ---
# The wasm build exists so the editor on etamil.in can report real diagnostics
# and offer real completions without a server. It exposes lexer -> parser ->
# check and nothing else; see src/wasm.rs.
# wasm-bindgen is the only addition. Nothing reachable from src/wasm.rs needs
# randomness, a filesystem or a socket, so the browser build carries just the
# front end: logos, rust_decimal, serde and this.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
# `signing` is real ECDSA over P-256, and that works perfectly well in a
# browser -- stubbing it would mean returning key pairs that are not keys. So
# it is carried rather than gated.
p256 = { version = "0.14.0", features = ["ecdsa"] }
# Two entries for one crate, and both are needed. getrandom refuses to build
# for wasm32-unknown-unknown unless told which backend to use, and the tree
# holds two incompatible majors: 0.3, which signing.rs calls by name, and 0.4,
# which p256 pulls in through rand_core. A feature can only be enabled on a
# direct dependency, so the second is declared under a different name purely to
# switch `wasm_js` on for the copy that would otherwise fail the build.
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[features]
# Optional LLVM code generation (not available on Windows)
llvm = ["llvm-sys"]
sqlite = ["rusqlite"]
# `dep:` keeps the optional dependency from also creating a feature of its
# own name, so this one can pull in the decimal integration alongside it.
postgres = ["dep:postgres", "dep:bytes", "rust_decimal/db-postgres"]
# Outbound HTTP is a feature so a build that does not need it does not carry a
# TLS stack. On by default: an API that cannot call a payment gateway is not
# much of an API.
http-client = ["dep:ureq", "dep:rustls", "dep:rustls-pemfile", "dep:webpki-roots"]
mysql = ["dep:mysql"]
default = ["sqlite", "http-client"]
rustls = ["dep:rustls"]
rustls-pemfile = ["dep:rustls-pemfile"]
webpki-roots = ["dep:webpki-roots"]
mongodb = ["dep:mongodb"]

[profile.dev]
# Line tables, not full debug info. The default, `debug = true`, produced a
# 40.9 GB target/debug against release's 4.1 GB on the same code -- ten times
# the size -- because every test binary carries a .pdb on Windows MSVC and
# there are eight of them. It also broke a build outright: `LNK1318 ... LIMIT`
# is the linker failing to write one of those files, and the disk it was
# writing to had run out.
#
# `debug = 1` keeps what is actually read -- the file and line in a panic or a
# backtrace -- and drops the variable-inspection data a step debugger wants.
# Raise it to `true` locally if you need to step through something.
debug = 1

[profile.release]
# The headline feature is a small standalone binary, so optimize for that.
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
# Building a package fixture for the பொதி_* tests.
zip = { version = "8", default-features = false, features = ["deflate"] }
