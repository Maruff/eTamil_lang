[package]
name = "etamil_pg"
version = "0.0.1"
# 2021, as `cargo pgrx new` writes it: the macros are generated for that edition.
edition = "2021"
# pgrx 0.19 itself needs Rust 1.96. The compiler this links needs only 1.88.
rust-version = "1.96"
description = "PL/eTamil spike: run eTamil inside PostgreSQL"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg16"]
pg13 = ["pgrx/pg13", "pgrx-tests/pg13"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19"]
pg_test = []

[dependencies]
pgrx = "=0.19.3"
# Everything about running a program lives here, so it is built and tested without
# PostgreSQL (and on Windows, where pgrx does not build).
etamil_pg_eval = { path = "eval" }
# The compiler's decimal type, to turn a numeric into an eTamil number and back.
rust_decimal = "1.37"

[dev-dependencies]
pgrx-tests = "=0.19.3"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
