[package]
name = "tree-sitter-etamil"
description = "eTamil grammar for tree-sitter — a Tamil-vocabulary programming language for Indian accounting, tax and FinTech"
version = "0.4.0"
authors = ["Mohammed Maruff (Esan Maruff) <esan@etamil.in>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "etamil"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/Maruff/tree-sitter-etamil"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "keywords.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"
