[[library]]
name = "Adafruit NeoPixel"

[[include]]
header = "Adafruit_NeoPixel.h"

[[object]]
cpp = "Adafruit_NeoPixel valayam(8, 6, NEO_GRB + NEO_KHZ800);"

[[function]]
etamil = "விளக்குகள்_தொடங்கு"
cpp = "valayam.begin"

[[function]]
etamil = "விளக்குகள்_ஒளி"         # 0 to 255 for the whole ring
cpp = "valayam.setBrightness"
args = ["int"]

[[function]]
etamil = "விளக்கு_நிறம்"           # which LED, then red, green, blue
cpp = "valayam.setPixelColor({0}, valayam.Color({1}, {2}, {3}))"
args = ["int", "int", "int", "int"]

[[function]]
etamil = "விளக்குகள்_அணை"
cpp = "valayam.clear"

[[function]]
etamil = "விளக்குகள்_காட்டு"       # nothing changes on the ring until this
cpp = "valayam.show"
