# Publish packages for Windows, Linux and macOS.
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# Each platform builds on its own runner. Nothing is cross-compiled except the
# musl targets, which are what let the Linux binaries run on distributions older
# than the one that built them.
name: Release packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  package:
    name: package (${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            package: etamil-linux-x64.tar.gz
            setup: musl
          # Raspberry Pi 4 and 5 on 64-bit Raspberry Pi OS, and any other
          # aarch64 Linux. Built on an ARM runner rather than through cross, so
          # the smoke test below runs the binary natively instead of under
          # emulation. Static musl, like the x64 package, so it does not care
          # which Debian release the Pi is on.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            package: etamil-linux-arm64.tar.gz
            setup: musl
          # macOS is two genuinely different binaries. Shipping only the Intel
          # one would leave every Apple Silicon machine — which is every Mac
          # sold for years — with a package it cannot run.
          # Cross-compiled on the Apple Silicon runner: the macos-13 label is
          # being retired and a job asking for it queues forever rather than
          # failing, which is the worst of both.
          - os: macos-latest
            target: x86_64-apple-darwin
            package: etamil-macos-x64.tar.gz
            setup: native
          - os: macos-latest
            target: ''
            package: etamil-macos-arm64.tar.gz
            setup: native
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: etamil-windows-x64.zip
            setup: native

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.setup == 'musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Enabled for the packages only: someone downloading a binary cannot add
      # a cargo feature to it later. LLVM stays out — it needs LLVM present on
      # the machine that runs the compiler.
      - name: Build package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: postgres,mysql
          # The bundled SQLite, ring, zstd and zlib are C. cc picks musl-gcc for
          # the x64 musl target by itself, but for aarch64 it looks for an
          # aarch64-linux-musl-gcc cross compiler, which Ubuntu's musl-tools
          # does not ship. On the ARM runner musl-gcc is already the right one.
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: bash packaging/build.sh

      - name: Verify archive exists
        shell: bash
        run: test -s "dist/${{ matrix.package }}"

      # Kept in packaging/smoke-test.sh rather than inline: the checks involve
      # Tamil literals and a piped stdin, which are easy to get wrong through a
      # workflow's quoting and impossible to test without pushing a tag. As a
      # script it runs locally exactly as it runs here.
      - name: Run the packaged binary
        shell: bash
        run: bash packaging/smoke-test.sh "dist/${{ matrix.package }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: |
            dist/${{ matrix.package }}
            dist/${{ matrix.package }}.sha256
          if-no-files-found: error

  # Debian/Ubuntu packages, assembled from the Linux archives rather than
  # compiled again. The amd64 one is installed and run here, which is the only
  # real test of the package; the arm64 one is built and inspected.
  deb:
    name: deb packages
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: etamil-linux-*
          path: dist
          merge-multiple: true

      - name: Build packages
        run: |
          bash packaging/build-deb.sh dist/etamil-linux-x64.tar.gz
          bash packaging/build-deb.sh dist/etamil-linux-arm64.tar.gz

      - name: Inspect
        run: |
          for f in dist/*.deb; do dpkg-deb --info "$f"; dpkg-deb --contents "$f" | head -20; done

      - name: Install and run (amd64)
        run: |
          sudo apt-get install -y ./dist/etamil_*_amd64.deb
          etamil --version
          test -d /usr/share/etamil/nUlakam
          sudo apt-get remove -y etamil
          ! command -v etamil

      - uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  # RPM packages, assembled from the same Linux archives. As with the .deb, the
  # x86_64 one is installed and run, here in a Fedora container, and the aarch64
  # one is built and inspected.
  rpm:
    name: rpm packages
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: etamil-linux-*
          path: dist
          merge-multiple: true

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build packages
        run: |
          bash packaging/build-rpm.sh dist/etamil-linux-x64.tar.gz
          bash packaging/build-rpm.sh dist/etamil-linux-arm64.tar.gz

      - name: Inspect
        run: |
          for f in dist/*.rpm; do rpm -qpi "$f"; rpm -qpl "$f" | head -20; done

      - name: Install and run (x86_64, Fedora)
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest sh -c '
            set -e
            dnf install -y /dist/etamil-*.x86_64.rpm
            etamil --version
            test -d /usr/share/etamil/nUlakam
            dnf remove -y etamil
            ! command -v etamil
          '

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: |
            dist/*.rpm
            dist/*.rpm.sha256
          if-no-files-found: error

  # A flat apt repository, so that `apt install etamil` works and `apt upgrade`
  # finds new versions. Its index files are attached to the release next to the
  # packages, and the stable URL releases/latest/download/ serves them: no server
  # of our own. The index is signed with the key in the APT_GPG_PRIVATE_KEY secret
  # (a key without a passphrase, kept for this alone). Without the secret the index
  # is built and tested unsigned, and a version tag fails rather than publish it.
  apt:
    name: apt repository
    needs: deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: deb-packages
          path: dist

      - name: Test the index builder
        run: python3 -m unittest packaging/test_make_apt_index.py

      - name: Build the index
        run: python3 packaging/make-apt-index.py dist apt

      - name: Sign
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::warning::APT_GPG_PRIVATE_KEY is not set; the index is unsigned"
            case "$GITHUB_REF" in refs/tags/v*) echo "a release must be signed" >&2; exit 1 ;; esac
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          KEY="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')"
          gpg --batch --yes --pinentry-mode loopback --default-key "$KEY" --clearsign -o apt/InRelease apt/Release
          gpg --batch --yes --pinentry-mode loopback --default-key "$KEY" -abs -o apt/Release.gpg apt/Release
          gpg --export "$KEY" > apt/etamil-archive-keyring.gpg

      - name: Install from it with apt (Debian)
        run: |
          mkdir repo
          cp dist/*.deb apt/* repo/
          docker run --rm -v "$PWD/repo:/repo:ro" debian:stable sh -c '
            set -e
            if [ -f /repo/InRelease ]; then opt="signed-by=/repo/etamil-archive-keyring.gpg"; else opt="trusted=yes"; fi
            echo "deb [$opt] file:/repo ./" > /etc/apt/sources.list.d/etamil.list
            apt-get update
            apt-get install -y etamil
            etamil --version
            test -d /usr/share/etamil/nUlakam
          '

      - uses: actions/upload-artifact@v4
        with:
          name: apt-index
          path: apt/*
          if-no-files-found: error

  publish:
    name: publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, deb, rpm, apt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # The container image is assembled from the Linux archives built above, not
  # compiled again: the image holds exactly the binary people download. Pushed to
  # GitHub Container Registry on version tags only; a manual run builds and
  # smoke-tests it without publishing.
  docker:
    name: docker image
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: etamil-linux-*
          path: dist
          merge-multiple: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/etamil
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Single-arch, loaded locally, so the image can actually be run.
      - name: Build and smoke-test (amd64)
        run: |
          docker buildx build -f packaging/Dockerfile --platform linux/amd64 --load -t etamil:test .
          docker run --rm etamil:test --version

      - name: Build and push (amd64, arm64)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
