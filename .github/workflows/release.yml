# Publish packages for Windows, Linux, macOS and Android.
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# Each platform builds on its own runner. Nothing is cross-compiled except the
# musl targets, which are what let the Linux binaries run on distributions older
# than the one that built them, and Android, which has no runner of its own.
name: Release packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  package:
    name: package (${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            package: etamil-linux-x64.tar.gz
            setup: musl
          # Raspberry Pi 4 and 5 on 64-bit Raspberry Pi OS, and any other
          # aarch64 Linux. Built on an ARM runner rather than through cross, so
          # the smoke test below runs the binary natively instead of under
          # emulation. Static musl, like the x64 package, so it does not care
          # which Debian release the Pi is on.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            package: etamil-linux-arm64.tar.gz
            setup: musl
          # macOS is two genuinely different binaries. Shipping only the Intel
          # one would leave every Apple Silicon machine — which is every Mac
          # sold for years — with a package it cannot run.
          # Cross-compiled on the Apple Silicon runner: the macos-13 label is
          # being retired and a job asking for it queues forever rather than
          # failing, which is the worst of both.
          - os: macos-latest
            target: x86_64-apple-darwin
            package: etamil-macos-x64.tar.gz
            setup: native
          - os: macos-latest
            target: ''
            package: etamil-macos-arm64.tar.gz
            setup: native
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: etamil-windows-x64.zip
            setup: native
          # Android phones and tablets, for qos. Cross-compiled with the NDK
          # against Android's own libc, so host names resolve through Android's
          # resolver. It cannot run here; android-cli.yml runs the same build
          # for x86_64 in an emulator instead.
          - os: ubuntu-latest
            target: aarch64-linux-android
            package: etamil-android-arm64.tar.gz
            setup: android

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.setup == 'musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Pinned with android.yml: an NDK bump is a thing to do deliberately.
      - name: Install the Android NDK
        if: matrix.setup == 'android'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: false

      - name: Link with the NDK's clang
        if: matrix.setup == 'android'
        run: bash packaging/android-env.sh "${{ steps.ndk.outputs.ndk-path }}" "${{ matrix.target }}" >> "$GITHUB_ENV"

      # Enabled for the packages only: someone downloading a binary cannot add
      # a cargo feature to it later. LLVM stays out — it needs LLVM present on
      # the machine that runs the compiler.
      - name: Build package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: postgres,mysql
          # The bundled SQLite, ring, zstd and zlib are C. cc picks musl-gcc for
          # the x64 musl target by itself, but for aarch64 it looks for an
          # aarch64-linux-musl-gcc cross compiler, which Ubuntu's musl-tools
          # does not ship. On the ARM runner musl-gcc is already the right one.
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: bash packaging/build.sh

      - name: Verify archive exists
        shell: bash
        run: test -s "dist/${{ matrix.package }}"

      # Kept in packaging/smoke-test.sh rather than inline: the checks involve
      # Tamil literals and a piped stdin, which are easy to get wrong through a
      # workflow's quoting and impossible to test without pushing a tag. As a
      # script it runs locally exactly as it runs here.
      - name: Run the packaged binary
        if: matrix.setup != 'android'
        shell: bash
        run: bash packaging/smoke-test.sh "dist/${{ matrix.package }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: |
            dist/${{ matrix.package }}
            dist/${{ matrix.package }}.sha256
          if-no-files-found: error

  # Debian/Ubuntu packages, assembled from the Linux archives rather than
  # compiled again. The amd64 one is installed and run here, which is the only
  # real test of the package; the arm64 one is built and inspected.
  deb:
    name: deb packages
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: etamil-linux-*
          path: dist
          merge-multiple: true

      - name: Build packages
        run: |
          bash packaging/build-deb.sh dist/etamil-linux-x64.tar.gz
          bash packaging/build-deb.sh dist/etamil-linux-arm64.tar.gz

      - name: Inspect
        run: |
          for f in dist/*.deb; do dpkg-deb --info "$f"; dpkg-deb --contents "$f" | head -20; done

      - name: Install and run (amd64)
        run: |
          sudo apt-get install -y ./dist/etamil_*_amd64.deb
          etamil --version
          test -d /usr/share/etamil/nUlakam
          sudo apt-get remove -y etamil
          # bash remembers where it found etamil, and `command -v` reports that
          # remembered path even after the file is gone.
          hash -r
          ! command -v etamil

      - uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  publish:
    name: publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Publishes the `etamil` npm package, whose install script downloads the
  # release archives. It therefore runs after `publish`, never before: a package
  # on npm that points at assets which do not exist yet would fail every install.
  # Needs an NPM_TOKEN repository secret (an automation token).
  npm:
    name: npm package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set the package version from the tag
        working-directory: packaging/npm
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Publish
        working-directory: packaging/npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The container image is assembled from the Linux archives built above, not
  # compiled again: the image holds exactly the binary people download. Pushed to
  # GitHub Container Registry on version tags only; a manual run builds and
  # smoke-tests it without publishing.
  docker:
    name: docker image
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: etamil-linux-*
          path: dist
          merge-multiple: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/etamil
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Single-arch, loaded locally, so the image can actually be run.
      - name: Build and smoke-test (amd64)
        run: |
          docker buildx build -f packaging/Dockerfile --platform linux/amd64 --load -t etamil:test .
          docker run --rm etamil:test --version

      - name: Build and push (amd64, arm64)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The `etamil` and `etamil-lsp` .NET tool packages, wrapped around the binaries in
  # the archives built above (nothing is compiled again). The Linux runner installs
  # them as tools and runs them, which is also the first real test of the launcher
  # restoring the execute bit that a NuGet package does not keep. Pushed to nuget.org
  # on version tags only; needs a NUGET_API_KEY repository secret.
  nuget:
    name: NuGet tool packages
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: etamil-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the packages
        run: python3 packaging/nuget/build-nuget.py --out nupkgs

      - name: Install them as tools and run them
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/tools" --add-source nupkgs etamil
          dotnet tool install --tool-path "$RUNNER_TEMP/tools" --add-source nupkgs etamil-lsp
          "$RUNNER_TEMP/tools/etamil" --version
          printf 'இறக்கு "nUlakam/paNam/paNam.qmz";\nஅச்சு ரூபாய்(12345678.5);\n' > money.qmz
          "$RUNNER_TEMP/tools/etamil" --vm money.qmz | grep -F '1,23,45,678.50'
          test -x "$RUNNER_TEMP/tools/etamil-lsp"

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nupkgs/*.nupkg
          if-no-files-found: error

      - name: Push to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
