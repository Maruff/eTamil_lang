name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The text checks, in one job rather than once per operating system.
  #
  # All five read source as text and none of them needs a compiler, so running
  # them inside the `compiler` matrix ran each one twice and reported a
  # single-source-of-truth failure as two failures on two operating systems.
  # A job of their own also names what broke: "conventions" failing says the
  # repository disagrees with itself, not that a build is broken.
  conventions:
    name: conventions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The website, for the counts check at the end. Public, so no token; and
      # `path:` keeps it out of the way of the compiler checkout at the root.
      - uses: actions/checkout@v4
        with:
          repository: Maruff/eTamil
          path: site

      # Explicit rather than the runner's default, which is what the matrix
      # relied on: these scripts are the gate on the language's own spelling
      # rules and should not change behaviour when a runner image does.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Audits every keyword's romanization against the ezuqqu scheme. It was
      # non-gating while 19 keywords were off-scheme; 18 are now on-scheme and
      # the one that stays is recorded in transliterate.py with its reason, so a
      # failure here is a real regression. See docs/ROADMAP.md item 6.
      - name: Romanization scheme check
        run: python scripts/transliterate.py --check

      # The same scheme, applied to the names that are not keywords — modules,
      # files, SQL tables and columns, record keys. `transliterate.py` reads
      # lexer.rs and nothing else, which is how `viziqam` for விகிதம் survived
      # in a module name, a table and two columns without any gate seeing it.
      - name: Romanized name check
        run: python scripts/check_names.py --check

      # The `_` and `__` marks that say which ASCII is English and which is
      # Tamil spelled in ASCII. `sum` and `col` are the same kind of word to
      # everything else in this build; under the eTamil font one of them draws
      # as ஸும் and the other as சொல், and only the mark tells them apart.
      # docs/reference/SCRIPT_RULES.md.
      - name: Script mark check
        run: python scripts/check_script_rules.py --check

      # Two differently named functions with the same body. Names cannot
      # collide — that is already zero — so this is the quieter kind: four ways
      # to pro-rate an amount by days and no agreement about which to call.
      # docs, and the reasons a group is allowed, are in the script itself.
      - name: Redundancy check
        run: python scripts/check_redundancy.py --check

      # What reaches a wasm build, and what the comments claim reaches one.
      # The boundary is one `#[cfg(not(target_family = "wasm"))]` per module
      # and it is described in prose in three places, all of which had drifted:
      # the crate doc said everything past the front end was gated out when
      # `vm` is not — which is the whole reason the editor on etamil.in runs a
      # program rather than only checking one — and three modules had their
      # notes off by one, a portable module's explanation sitting above the
      # gated driver before it. A compiler cannot catch any of that.
      - name: wasm boundary check
        run: python scripts/check_wasm_boundary.py --check

      # The website states how many keywords the language has in thirteen
      # places — the home page's statistics, the keyword reference, the manual,
      # the status table, the tour — and every one is a number typed by hand.
      # They went stale the moment a token landed: the site said 202 across 541
      # spellings when the answer was 203 and 545, and nothing anywhere said so.
      # `eTamil_Code/test/counts.test.js` already guards the extension's
      # figures; this guards the site's, from the same token table.
      #
      # It needs the site, which is a separate repository, hence the checkout
      # above. Note what that couples: a pull request here that adds a keyword
      # fails this step until the site is updated too. That is the intended
      # reading — the published numbers are about to become wrong — but it does
      # mean the fix lives in another repository.
      - name: Site counts match the lexer
        run: python scripts/check_site_counts.py --check --site site

  build-and-test:
    name: compiler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: etamil_compiler

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: etamil_compiler

      # Gating. These were non-gating while the code predated rustfmt and clippy
      # ever being run; that backlog is now clear, so a failure here is a
      # regression rather than history. Until it was cleared, every green run
      # still carried four red annotations, which is how a build ends up with
      # errors nobody reads.
      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - name: Test
        run: cargo test

  editor-support:
    name: editor support
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: etamil_compiler

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: eTamil_Code/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The extension's keyword lists and grammar are generated from the
      # compiler. This step is the whole reason they can be trusted: add a
      # keyword to lexer.rs without regenerating, and the build says so.
      #
      # Gating from the start, unlike the checks above — there is no backlog to
      # sweep here, because the generated files were committed already current.
      - name: Generated editor data matches the compiler
        run: python scripts/generate_editor_support.py --check

      - name: Install extension dependencies
        working-directory: eTamil_Code
        run: npm ci

      - name: Typecheck
        working-directory: eTamil_Code
        run: npm run build

      - name: Lint
        working-directory: eTamil_Code
        run: npm run lint

      # The snippet tests compile every template with the real binary, so the
      # compiler has to exist before they run.
      - name: Build the compiler
        working-directory: etamil_compiler
        run: cargo build --release

      - name: Test the grammar and the snippets
        working-directory: eTamil_Code
        run: npm test

      - name: Package the extension
        working-directory: eTamil_Code
        run: npx vsce package --out etamil-support.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: etamil-support-vsix
          path: eTamil_Code/etamil-support.vsix
          if-no-files-found: error

  # Everything that renders eTamil outside VS Code: the tree-sitter grammar
  # (Neovim, Helix, Zed, GitHub code navigation) and the highlight.js
  # definition (web docs and the browser playground). Both have their
  # vocabulary generated from the compiler by the editor-support job above, so
  # what is tested here is that they actually parse and highlight the language.
  grammars:
    name: tree-sitter and highlight.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the tree-sitter grammar's tools
        working-directory: tree-sitter-etamil
        run: npm ci

      # The committed src/parser.c must match grammar.js. Consumers build from
      # the committed parser without running the CLI, so a stale one ships a
      # grammar nobody generated.
      - name: The committed parser matches the grammar
        working-directory: tree-sitter-etamil
        run: |
          npx tree-sitter generate
          git diff --exit-code -- src/ || {
            echo "src/parser.c is stale; run: cd tree-sitter-etamil && npx tree-sitter generate"
            exit 1
          }

      - name: Corpus tests
        working-directory: tree-sitter-etamil
        run: npx tree-sitter test

      # The blunt check: parse every real eTamil program in the repository.
      # This is what found the multi-line string literals, the database
      # statements and the interval block, none of which any hand-written
      # corpus test happened to cover.
      - name: Parse the standard library and every example
        working-directory: tree-sitter-etamil
        run: node test/parse-corpus.mjs

      - name: Install highlight.js
        working-directory: eTamil_HighlightJS
        run: npm ci

      - name: highlight.js definition
        working-directory: eTamil_HighlightJS
        run: npm test

  examples:
    name: examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: etamil_compiler

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build (release)
        working-directory: etamil_compiler
        run: cargo build --release

      # README presents this as part of testing — "every example also runs with
      # its expected outcome checked, including the ones that are supposed to
      # fail" — but nothing ran it. It is the check most likely to catch a
      # documentation regression.
      - name: Run every example
        run: ./scripts/run_examples.sh

  # The uqavi/ samples are the library's documentation: one runnable program
  # per function. They are a separate job rather than another step in the one
  # above because there are hundreds and each costs about a second — as a step
  # they would add a quarter of an hour to the critical path, and as a job they
  # add none, since the two run at the same time.
  samples:
    name: samples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: etamil_compiler

      - name: Build (release)
        working-directory: etamil_compiler
        run: cargo build --release

      - name: Run every sample
        run: ./scripts/run_samples.sh

  # The LLVM backend is behind a feature nothing else builds, so it has now
  # broken twice without anyone noticing: both times a field was added to an
  # AST node and the pattern in codegen.rs was left naming too few, which is a
  # hard error rather than a warning. Building it here is the only thing that
  # catches that before someone with LLVM installed tries to use it.
  # Same reasoning as the LLVM job below: a feature nothing else builds is a
  # feature that breaks without anyone noticing. This one needs no server —
  # the conversion between eTamil values and BSON is where the risk is, and it
  # is unit-tested. Talking to a real deployment is gated on ETAMIL_MONGO and
  # is not run here.
  mongodb-driver:
    name: MongoDB driver builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: etamil_compiler

      # The whole suite with the feature on, not a `mongo` filter.
      #
      # The filter used to be the last argument, and nothing in the suite is
      # named `mongo`: all 303 tests were filtered out in both binaries and the
      # job went green having executed nothing. It still proved the driver
      # compiles, which is what this job is named for, but a green tick that
      # says "and test" while running no test is worse than one that does not
      # claim to. Running everything with the feature enabled costs seconds on
      # top of the build and answers the wider question — whether turning the
      # driver on breaks anything else.
      - name: Build and test with --features mongodb
        working-directory: etamil_compiler
        run: cargo test --features mongodb

  # The browser build, which nothing here checked until it broke twice in one
  # afternoon and neither failure showed up on a native build.
  #
  # Both were mine and both were invisible natively: a `#[cfg(not(wasm))]` left
  # orphaned onto `pub mod vm;` when the module below it was deleted, which took
  # the VM out of the browser build entirely; and a `FunctionDef` pattern in
  # wasm.rs that stopped naming every field after one was added. A native build
  # compiles happily through both.
  #
  # `--lib` on purpose: the binary needs a filesystem, sockets and tokio, and is
  # not what runs in a browser.
  wasm-build:
    name: browser build (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: etamil_compiler

      - name: Check the library for wasm32
        working-directory: etamil_compiler
        run: cargo check --lib --target wasm32-unknown-unknown --no-default-features

  llvm-backend:
    name: LLVM backend builds
    # Pinned, not ubuntu-latest: Cargo.toml pins llvm-sys 180, so this job
    # needs Ubuntu's llvm-18-dev, with its AVR and ARM targets for artino.
    # ubuntu-latest moves to Ubuntu 26 from 19 October 2026, which may not carry
    # LLVM 18. Move this when llvm-sys moves.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: etamil_compiler

      # llvm-sys wants a matching llvm-config on PATH; the runner ships
      # several versions, so name the one Cargo.toml pins.
      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libpolly-18-dev
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"

      # `set -o pipefail` is not optional here. The runner's shell is `bash -e`
      # without it, so piping to tee would report the exit status of tee — and
      # a failing build would pass.
      - name: Build with --features llvm
        working-directory: etamil_compiler
        run: |
          set -o pipefail
          cargo build --features llvm 2>&1 | tee "$RUNNER_TEMP/llvm-build.log"

      # The two backends must not disagree. A program the LLVM backend refuses
      # is expected and only counted; a program it accepts and then answers
      # differently from the VM is a failure, because that is the case nobody
      # would notice from the outside. The summary also lists what the backend
      # could not build, which is the difference between the two stated as
      # work rather than as an impression.
      #
      # Reuses the binary built above rather than a release one: this job is
      # about whether the backend still works, not how fast it is.
      - name: Backend parity (--vm against --llvm)
        run: |
          set -o pipefail
          ETAMIL_BIN=etamil_compiler/target/debug/etamil ./scripts/run_parity.sh 2>&1             | tee "$RUNNER_TEMP/llvm-parity.log"

      # artino (docs/artino.md): every etamil_compiler/tests/artino program
      # compiled for this machine by the same lowering a board gets, linked
      # with the runtime over a stand-in Arduino API, and run. What it prints
      # must be what the VM prints, or its .expected; a .world file runs the
      # loop too. Every test runs twice, the second time as host-small, which
      # is how an Uno is compiled. Needs a C++ compiler, which the runner has.
      - name: artino conformance
        run: |
          set -o pipefail
          ETAMIL_BIN=etamil_compiler/target/debug/etamil ./scripts/artino_conformance.sh 2>&1 \
            | tee "$RUNNER_TEMP/artino-conformance.log"

      # The same programs, and the artino examples, for the boards themselves:
      # an AVR and a Cortex-M object each, and the sketch around it. The runner
      # has no arduino-cli, so nothing is linked. This is what LLVM makes of the
      # IR for each target, and the only place the AVR and ARM code generation
      # is exercised.
      - name: artino for the boards
        run: |
          set -o pipefail
          export ETAMIL_PATH="$PWD"
          {
            for board in uno mega pico pico2; do
              for program in examples/artino/*.qmz etamil_compiler/tests/artino/*.qmz; do
                if ! etamil_compiler/target/debug/etamil --artino --board "$board" \
                     --out "$RUNNER_TEMP/artino/$board" "$program" > "$RUNNER_TEMP/artino-one.log" 2>&1; then
                  cat "$RUNNER_TEMP/artino-one.log"
                  echo "failed: $program for $board"
                  exit 1
                fi
                echo "ok  $board  $program"
              done
            done
          } 2>&1 | tee "$RUNNER_TEMP/artino-boards.log"

      # Put the failure where it can be read without opening the log.
      #
      # This job fails as a bare "Process completed with exit code 1" in the
      # annotations panel, which names the job and nothing else. Both plausible
      # causes — llvm-sys not finding or linking LLVM 18, and the two backends
      # disagreeing on an answer — look identical from outside, and they have
      # nothing in common as fixes. So the error goes in the run summary, which
      # is visible without drilling into a step.
      - name: Why it failed
        if: failure()
        run: |
          for log in llvm-build llvm-parity artino-conformance artino-boards; do
            path="$RUNNER_TEMP/$log.log"
            [ -f "$path" ] || continue
            {
              echo "### $log"
              echo '```'
              tail -n 60 "$path"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

